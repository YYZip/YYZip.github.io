<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0">
    <title>YOU WIKI</title>
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <link href="youWiki/fonts/css/fontawesome.min.css" rel="stylesheet">
    <link href="youWiki/fonts/css/solid.min.css" rel="stylesheet">
    <link rel="stylesheet" href="youWiki/css/themes.css">
    <link rel="stylesheet" href="youWiki/css/style.css">
    <link rel="stylesheet" href="youWiki/css/ink.css">
    <link rel="stylesheet" href="assets/css/custom.css">
    <link rel="stylesheet" href="assets/css/ink.css">
</head>
<body class="theme-custom">
    <div class="main-container">
        <aside id="sidebar">
            <div class="sidebar-section sidebar-section-border-b">
                <div class="sidebar-header">
                    <h1 class="sidebar-title">YYZIP</h1>
                    <div class="theme-buttons">
                        <button id="themeLight" class="btn-theme" title="白色主题">
                            <i class="fa-solid fa-sun"></i>
                        </button>
                        <button id="themeDark" class="btn-theme" title="黑色主题">
                            <i class="fa-solid fa-moon"></i>
                        </button>
                        <button id="themeCustom" class="btn-theme" title="CIDE主题">
                            <i class="fa-solid fa-palette"></i>
                        </button>
                    </div>
                </div>

                <div class="search-wrapper">
                    <input type="text" id="titleFilter" placeholder="筛选标题……" class="input-search">
                    <i class="fa-solid fa-search search-icon"></i>
                </div>
            </div>

            <nav id="navigation" class="sidebar-section">
            </nav>

            <div class="sidebar-section sidebar-section-border-t cache-info">
                <div class="cache-info-row">
                    <span>缓存状态:</span>
                    <span id="cacheStatus">未缓存</span>
                </div>
                <div class="cache-info-row">
                    <span>最后缓存:</span>
                    <span id="lastCacheTime">-</span>
                </div>
                <button id="refreshCache" class="refresh-cache-btn">
                    刷新缓存
                </button>
            </div>
        </aside>

        <main id="mainContainer" class="main-content">
            <div id="ticker" class="ticker-container"></div>

            <div id="content" class="content-area">
            </div>

            <div id="pageNavigation" class="page-navigation">
            </div>
        </main>
    </div>

    <div id="sidebarOverlay"></div>

    <button id="menuToggle" class="btn-float menu-toggle md:hidden">
         <i class="fa-solid fa-bars"></i>
    </button>

    <button id="searchButton" class="btn-float search-btn">
        <i class="fa-solid fa-search"></i>
    </button>

    <button id="backToTop" class="btn-float back-top">
        <i class="fa-solid fa-arrow-up"></i>
    </button>

    <button id="pageTocToggle" class="btn-float toc-toggle">
        <i class="fa-solid fa-list"></i>
    </button>

    <div id="pageToc" class="page-toc">
        <ul class="toc-list">
        </ul>
    </div>

    <div id="copyright" class="copyright">
        Powered by <a href="https://github.com/yyzip/YOU-WIKI" target="_blank">youWiki</a> 2026
    </div>

    <div id="searchModal" class="search-modal">
        <div class="search-modal-content">
            <div class="search-modal-header">
                <input type="text" id="fullTextSearch" placeholder="搜索内容……" class="search-modal-input">
                <button id="closeSearchModal" class="search-modal-close">
                    <i class="fa-solid fa-times"></i>
                </button>
            </div>
            <div id="searchResults" class="search-modal-results">
            </div>
        </div>
    </div>

    <!-- 工具模块 -->
    <script src="youWiki/js/utils.js"></script>
    <script src="youWiki/js/ink/ink.js"></script>

    <!-- 核心模块 -->
    <script src="youWiki/js/cache.js"></script>
    <script src="youWiki/js/markdownParser.js"></script>
    <script src="youWiki/js/pageFinder.js"></script>
    <script src="youWiki/js/richText.js"></script>

    <!-- 组件模块 -->
    <script src="youWiki/js/sidebar.js"></script>
    <script src="youWiki/js/pageUI.js"></script>
    <script src="youWiki/js/search.js"></script>
    <script src="youWiki/js/ink/inkRuntime-core.js"></script>
    <script src="youWiki/js/ink/inkRuntime-text.js"></script>
    <script src="youWiki/js/ink/inkRuntime-save.js"></script>
    <script src="youWiki/js/ink/inkRuntime-render.js"></script>
    <script src="youWiki/js/ink/inkRuntime.js"></script>

    <!-- 事件模块 -->
    <script src="youWiki/js/events.js"></script>

    <!-- 导航和主入口 -->
    <script src="youWiki/js/navigation.js"></script>
    <script src="youWiki/js/main.js"></script>

    <script src="assets/js/custom.js"></script>
</body>
</html>
